[package]
name = "pslinkb"
version = "0.3.5"
edition = "2024"
description = "PS5 to Bilibili Live Streaming Bridge"
license = "MIT OR Apache-2.0"
default-run = "pslinkb"

[[bin]]
name = "pslinkb"
path = "src/main.rs"

[[bin]]
name = "pslinkb-windivert"
path = "src/bin/windivert.rs"
required-features = ["windivert"]

[dependencies]
blivemsg = "0.2.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time", "process"] }
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rtmp-rs = "0.5.0"
async-trait = "0.1.89"
thiserror = "2.0.18"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "cookies"] }
md5 = "0.8.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
libc = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

clap = { version = "4.6.1", features = ["derive"], optional = true }
toml = { version = "1.1.2", optional = true }
if-addrs = { version = "0.15.0", optional = true }
qrcode = { version = "0.14.1", optional = true }
hickory-proto = { version = "0.26.1", optional = true }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
cli = ["clap", "toml", "qrcode", "if-addrs"]
channel-mpsc = []
channel-broadcast = []
protobuf-support = ["blivemsg/protobuf-support"]
openwrt = []
external-ffmpeg = []
ffi-ffmpeg = []
dns-redirect = ["hickory-proto"]
windivert = ["dns-redirect"]
debug-log = []

[build-dependencies]
cc = "1"
